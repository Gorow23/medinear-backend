<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Med Plus</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans&family=DM+Serif+Display&display=swap" rel="stylesheet">

  <!-- Your CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAV -->
<nav>
  <div class="logo">
    <div class="logo-icon">+</div>
    Med <span>Plus</span>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-text">
    <h1>Find Medicines <br> From <em>Nearby</em> Stores</h1>
    <p>Search pharmacies near your location and get medicines delivered.</p>

    <!-- LOCATION -->
    <div class="location-search">
      <div class="loc-input-wrap">
        <input type="text" placeholder="Enter your pincode">
      </div>
      <button class="btn-primary">Find Stores</button>
    </div>

    <br><br>

    <!-- MEDICINE SEARCH -->
    <div class="location-search">
      <div class="loc-input-wrap">
        <input type="text" id="medicineInput" placeholder="Search medicine (e.g. dolo)">
      </div>
      <button class="btn-primary" onclick="searchMedicine()">Search Medicine</button>
    </div>
  </div>
</section>

<!-- RESULTS -->
<section>
  <h2 class="section-title">Search Results</h2>
  <div id="results" class="prod-grid"></div>
</section>

<script>
async function searchMedicine() {
    const name = document.getElementById("medicineInput").value;

    if (!name) {
        alert("Enter medicine name");
        return;
    }

    try {
        const response = await fetch(`http://127.0.0.1:8000/medicines/search?name=${name}`);
        const data = await response.json();

        let html = "";

        if (data.length === 0) {
            html = `<p class="empty-msg">No medicines found</p>`;
        } else {
            data.forEach(med => {
                html += `
                <div class="prod-card">
                    <div class="prod-img">
                        💊
                    </div>
                    <div class="prod-info">
                        <div class="prod-cat">Medicine</div>
                        <div class="prod-name">${med.name}</div>
                        <div class="prod-footer">
                            <div class="prod-price">₹${med.price}</div>
                            
                            <!-- ✅ ONLY CHANGE HERE -->
                            <button class="btn-add" onclick='addToCart(${JSON.stringify(med)})'>Order</button>

                        </div>
                    </div>
                </div>
                `;
            });
        }

        document.getElementById("results").innerHTML = html;

    } catch (error) {
        alert("Error fetching medicines");
        console.error(error);
    }
}

// ===== CART SYSTEM (FIXED) =====
function addToCart(med) {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart.push(med);

    localStorage.setItem("cart", JSON.stringify(cart));

    alert(med.name + " added to cart");
}
</script>

</body>
</html>
